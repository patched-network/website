[build]
  command = "yarn run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  YARN_VERSION = "1.22.22"

# Retired Gridsome pages (archived posts still link to /contact).
[[redirects]]
  from = "/contact"
  to = "https://github.com/patched-network"
  status = 301

[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[redirects]]
  from = "/skuilder/*"
  to = "/vue-skuilder/:splat"
  status = 301

[[redirects]]
  from = "/vue-skuilder/*"
  to = "https://patched-network.github.io/vue-skuilder/:splat"
  status = 200
  force = true

[context.production]
  command = "yarn run build"

# llms.txt and the per-post markdown mirrors (written by buildEnd in .vitepress/config.mts)
[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/blog/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
